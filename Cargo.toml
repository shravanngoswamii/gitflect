[package]
name = "gitflect"
version = "0.4.1"
authors = ["Shravan Goswami <contact@shravangoswami.com>"]
edition = "2024"
rust-version = "1.85"
description = "A fast Rust Git prompt and Bash/Zsh integration inspired by posh-git"
license = "MIT"
readme = "README.md"
repository = "https://github.com/shravanngoswamii/gitflect"
homepage = "https://shravangoswami.com/gitflect/"
documentation = "https://shravangoswami.com/gitflect/docs/start/install/"
keywords = ["git", "prompt", "bash", "zsh", "posh-git"]
categories = ["command-line-utilities", "development-tools"]
exclude = [
    ".github/",
    "docs/",
    ".githooks/",
    "*.sh",
]

[[bin]]
name = "gitflect"
path = "src/main.rs"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
