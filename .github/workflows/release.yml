name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  issues: write

env:
  BIN_NAME: gitflect
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read version
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must look like v1.2.3; got ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          cargo_version="$(grep -m1 '^version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')"
          if [[ "$version" != "$cargo_version" ]]; then
            echo "Tag version v$version does not match Cargo.toml version $cargo_version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  quality:
    name: Quality gate
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --locked

      - name: Check installer syntax
        run: sh -n install.sh && sh -n uninstall.sh

  build:
    name: Build ${{ matrix.target }}
    needs:
      - validate
      - quality
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            use-cross: false
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            use-cross: true
          - os: macos-latest
            target: x86_64-apple-darwin
            use-cross: false
          - os: macos-latest
            target: aarch64-apple-darwin
            use-cross: false

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use-cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build
        shell: bash
        run: |
          if [[ "${{ matrix.use-cross }}" == "true" ]]; then
            cross build --locked --release --target "${{ matrix.target }}"
          else
            cargo build --locked --release --target "${{ matrix.target }}"
          fi

      - name: Package
        shell: bash
        run: |
          archive="${BIN_NAME}-${{ matrix.target }}"
          mkdir -p "$archive"
          cp "target/${{ matrix.target }}/release/${BIN_NAME}" "$archive/"
          cp README.md LICENSE "$archive/"
          tar -czf "${archive}.tar.gz" "$archive"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${archive}.tar.gz" > "${archive}.tar.gz.sha256"
          else
            shasum -a 256 "${archive}.tar.gz" > "${archive}.tar.gz.sha256"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: gitflect-${{ matrix.target }}
          path: |
            gitflect-${{ matrix.target }}.tar.gz
            gitflect-${{ matrix.target }}.tar.gz.sha256
          compression-level: 0

  publish:
    name: Publish GitHub release
    needs:
      - validate
      - build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          name: v${{ needs.validate.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/*.sha256
            install.sh
            uninstall.sh

  publish-crates:
    name: Publish crates.io
    needs:
      - validate
      - publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked

  notify:
    name: Notify release comment
    if: always() && needs.validate.result == 'success'
    needs:
      - validate
      - publish
      - publish-crates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Read trigger context from tag annotation
        id: ctx
        run: |
          annotation=$(git tag -l "${{ github.ref_name }}" --format='%(contents)')
          issue=$(printf '%s' "$annotation" | grep '^issue=' | cut -d= -f2)
          comment=$(printf '%s' "$annotation" | grep '^comment=' | cut -d= -f2)
          echo "issue=${issue}" >> "$GITHUB_OUTPUT"
          echo "comment=${comment}" >> "$GITHUB_OUTPUT"

      - name: Update release comment
        if: steps.ctx.outputs.comment != ''
        uses: actions/github-script@v8
        env:
          COMMENT_ID: ${{ steps.ctx.outputs.comment }}
          RELEASE_RESULT: ${{ needs.publish.result }}
          CRATES_RESULT: ${{ needs.publish-crates.result }}
        with:
          script: |
            const tag     = context.ref.replace('refs/tags/', '');
            const version = tag.replace(/^v/, '');
            const repo    = `${context.repo.owner}/${context.repo.repo}`;

            const status = r => ({ success: 'success', failure: 'FAILED', cancelled: 'cancelled', skipped: 'skipped' }[r] ?? r);
            const releaseResult = process.env.RELEASE_RESULT;
            const cratesResult  = process.env.CRATES_RESULT;
            const allGood = releaseResult === 'success' && cratesResult === 'success';

            const headline = allGood
              ? `**gitflect ${tag} released**`
              : `**gitflect ${tag} — some steps failed** — [view run](https://github.com/${repo}/actions/runs/${context.runId})`;

            const body = [
              '/release',
              '',
              '---',
              headline,
              '',
              '| Destination | Status |',
              '| :-- | :-- |',
              `| [GitHub Release](https://github.com/${repo}/releases/tag/${tag}) | ${status(releaseResult)} |`,
              `| [crates.io](https://crates.io/crates/gitflect/${version}) | ${status(cratesResult)} |`,
            ].join('\n');

            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: parseInt(process.env.COMMENT_ID, 10),
              body,
            });
